<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autenticando...</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div style="text-align:center; margin-top: 40vh;">
    <p style="color: #a0a0a0; font-size: 1.1rem;">⏳ Iniciando sesión con Google...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      localStorage.setItem('token', token);

      // Decodificar el token para obtener el rol (maneja UTF-8 correctamente, ej. ñ, tildes)
      const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      const payload = JSON.parse(jsonPayload);
      localStorage.setItem('usuario', JSON.stringify(payload));

      // Redirigir según el rol
      if (payload.rol === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    } else {
      alert('Error al iniciar sesión con Google.');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html> // test auto-deploy
