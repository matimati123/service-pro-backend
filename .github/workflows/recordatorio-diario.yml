name: Recordatorio diario de visitas

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Avisar las visitas de mañana (cliente y técnico)
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "x-backup-token: ${BACKUP_TOKEN}" \
            https://service-pro-backend-u3wn.onrender.com/tareas/recordatorios
