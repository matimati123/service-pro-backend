name: Respaldo diario de la base de datos

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir el respaldo al backend (llega por correo)
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "x-backup-token: ${BACKUP_TOKEN}" \
            https://service-pro-backend-u3wn.onrender.com/respaldo/ejecutar
