name: Reporte semanal por correo

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enviar el resumen de la semana al administrador
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "x-backup-token: ${BACKUP_TOKEN}" \
            https://service-pro-backend-u3wn.onrender.com/tareas/reporte-semanal
