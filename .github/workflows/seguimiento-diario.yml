name: Seguimiento diario (encuestas y órdenes estancadas)

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir calificación a clientes con orden completada
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "x-backup-token: ${BACKUP_TOKEN}" \
            https://service-pro-backend-u3wn.onrender.com/tareas/encuestas
      - name: Avisar órdenes estancadas en pendiente
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "x-backup-token: ${BACKUP_TOKEN}" \
            https://service-pro-backend-u3wn.onrender.com/tareas/seguimiento
